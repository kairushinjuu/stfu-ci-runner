name: Public OpenRISC Linux guest executable cross-build
on:
  push:
    paths:
      - .github/workflows/stfu-openrisc-guest-toolchain.yml
permissions:
  contents: read
jobs:
  build-openrisc-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce public-only source and no private media
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: test "$PRIVATE" = false
      - name: Install public or1k musl cross-toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/or1k"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/or1k-toolchain.tar.xz" 'https://github.com/stffrdhrn/or1k-toolchain-build/releases/download/or1k-14.2.0-20250418/or1k-none-linux-musl-14.2.0-20250418.tar.xz'
          tar -C "$RUNNER_TEMP/or1k" -xf "$RUNNER_TEMP/or1k-toolchain.tar.xz"
          find "$RUNNER_TEMP/or1k" -type f -name '*gcc' | head -12
          echo "OR1K_CC=$(find "$RUNNER_TEMP/or1k" -type f -name 'or1k*-gcc' | head -1)" >> "$GITHUB_ENV"
      - name: Cross-compile real guest ELF for Linux OpenRISC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/or1k-output"
          cat > "$RUNNER_TEMP/or1k-output/guest_probe.c" <<'EOF'
          #include <unistd.h>
          #include <sys/utsname.h>
          #include <string.h>
          int main(void) {
            static const char marker[] = "STFU_NEW_GUEST_ELF_EXECUTED\n";
            write(1, marker, sizeof(marker)-1);
            struct utsname info;
            if (uname(&info)==0) {
              write(1, info.machine, strlen(info.machine));
              write(1, "\n", 1);
            }
            return 0;
          }
          EOF
          "$OR1K_CC" -static -Os -s -o "$RUNNER_TEMP/or1k-output/guest_probe.or1k" "$RUNNER_TEMP/or1k-output/guest_probe.c"
          file "$RUNNER_TEMP/or1k-output/guest_probe.or1k"
          sha256sum "$RUNNER_TEMP/or1k-output/guest_probe.or1k" | tee "$RUNNER_TEMP/or1k-output/manifest.sha256"
          test "$(stat -c%s "$RUNNER_TEMP/or1k-output/guest_probe.or1k")" -lt 1048576
      - name: Expose public test executable as base64 for verified connector recovery
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/or1k-output/guest_probe.or1k"
          test "$(stat -c%s "$BIN")" -lt 131072
          printf 'STFU_ELF_B64_BEGIN\\n'
          base64 -w 0 "$BIN"
          printf '\\nSTFU_ELF_B64_END\\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openrisc-public-guest-elf
          path: ${{ runner.temp }}/or1k-output/
          retention-days: 7
