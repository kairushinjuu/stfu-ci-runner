# Public official Android SDK image only. No private source or commercial media.
name: Split public Android system image for size-limited transfers
on:
  push:
    paths:
      - .github/workflows/stfu-free-android-image-split.yml
permissions:
  actions: read
  contents: read
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate free public repository
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: test "$PRIVATE" = false
      - name: Retrieve prior public-only official system-image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download" "$RUNNER_TEMP/parts"
          gh run download 45027956115 --repo kairushinjuu/stfu-ci-runner --name android-11-googleapis-x86_64-official --dir "$RUNNER_TEMP/download"
          ARCHIVE="$RUNNER_TEMP/download/android-11-googleapis-x86_64.tar.gz"
          test -s "$ARCHIVE"
          sha256sum "$ARCHIVE" | tee "$RUNNER_TEMP/parts/sha256sum.txt"
          split -b 250M -d -a 2 "$ARCHIVE" "$RUNNER_TEMP/parts/sysimg-"
          ls -lh "$RUNNER_TEMP/parts"
          test "$(find "$RUNNER_TEMP/parts" -name 'sysimg-*' | wc -l)" -eq 6
      - uses: actions/upload-artifact@v4
        with:
          name: stfu-sysimg-part00
          path: ${{ runner.temp }}/parts/sysimg-00
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: stfu-sysimg-part01
          path: ${{ runner.temp }}/parts/sysimg-01
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: stfu-sysimg-part02
          path: ${{ runner.temp }}/parts/sysimg-02
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: stfu-sysimg-part03
          path: ${{ runner.temp }}/parts/sysimg-03
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: stfu-sysimg-part04
          path: ${{ runner.temp }}/parts/sysimg-04
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: stfu-sysimg-part05
          path: ${{ runner.temp }}/parts/sysimg-05
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: stfu-sysimg-manifest
          path: ${{ runner.temp }}/parts/sha256sum.txt
          compression-level: 0
          retention-days: 2
