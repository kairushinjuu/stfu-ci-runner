name: Stage48 Android overlay quick Java compile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stfu-stage48-java-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-java:
    if: github.repository == 'kairushinjuu/stfu-ci-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kairushinjuu/2004s
          ref: stfu-stage42-private-media-test
          token: ${{ secrets.STFU_PRIVATE_READ_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Compile actual Stage48 Android dialog, importer and audio launch UI
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' >/dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/stfu-java"
          base=private/stfu-native
          javac -Xlint:all -cp "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" -d "$RUNNER_TEMP/stfu-java" \
            "$base/stage48-debug/GameActivity.java" \
            "$base/stage48-debug/SetupActivity.java" \
            "$base/stage48-debug/LaunchPreparation.java" \
            "$base/stage39-original-media/GameAssetImporter.java" \
            "$base/stage40-three-packages/OriginalSplitMediaImporter.java" \
            > "$RUNNER_TEMP/java-compile-private.log" 2>&1 || { echo 'Private Java validation failed; check encrypted build artifacts'; exit 1; }
          echo 'Stage48 actual Android Java overlay + experimental audio launch compile PASS'
          test -f "$RUNNER_TEMP/stfu-java/org/stfu/nativeport/GameActivity.class"
          test -f "$RUNNER_TEMP/stfu-java/org/stfu/nativeport/SetupActivity.class"
