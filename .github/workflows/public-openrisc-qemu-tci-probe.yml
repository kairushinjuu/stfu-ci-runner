# Experimental QEMU TCI cross-configure against a public OpenRISC Linux toolchain.
# PUBLIC ONLY. Do not introduce any STFU original game content or private repository.
name: Public QEMU TCI OpenRISC host feasibility
on:
  push:
    paths:
      - .github/workflows/public-openrisc-qemu-tci-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-or1k-tci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Assert public-only experiment
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: test "$PRIVATE" = false
      - name: Install host build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git ninja-build pkg-config meson python3 python3-venv libglib2.0-dev libpixman-1-dev libfdt-dev make curl xz-utils
      - name: Retrieve public OpenRISC Linux musl compiler and QEMU source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/cross.tar.xz" \
            https://github.com/stffrdhrn/or1k-toolchain-build/releases/download/or1k-16.1.0-20260704/or1k-none-linux-musl-16.1.0-20260704.tar.xz
          tar -xf "$RUNNER_TEMP/cross.tar.xz" -C "$RUNNER_TEMP/cross"
          cc="$(find "$RUNNER_TEMP/cross" -type f -path '*/bin/*-gcc' | head -1)"
          test -x "$cc"
          echo "OR1K_CC=$cc" >> "$GITHUB_ENV"
          printf 'OpenRISC compiler: %s\n' "$cc"
          "$cc" -dumpmachine
          git clone -q --depth=1 --branch=v8.2.0 https://github.com/qemu/qemu.git "$RUNNER_TEMP/qemu"
          mkdir -p "$RUNNER_TEMP/evidence"
          "$cc" -v > "$RUNNER_TEMP/evidence/cross-compiler.txt" 2>&1
      - name: Attempt QEMU TCI configure for unsupported OpenRISC host
        shell: bash
        run: |
          set -uo pipefail
          prefix="${OR1K_CC%-gcc}"
          cd "$RUNNER_TEMP/qemu"
          # Prevent QEMU cross build from silently linking host-x86_64 libraries.
          sysroot="$("$OR1K_CC" -print-sysroot)"
          echo "prefix=$prefix" | tee "$RUNNER_TEMP/evidence/configure-summary.txt"
          echo "sysroot=$sysroot" | tee -a "$RUNNER_TEMP/evidence/configure-summary.txt"
          "$OR1K_CC" -dumpmachine | tee -a "$RUNNER_TEMP/evidence/configure-summary.txt"
          echo "checking target GLib libraries" | tee -a "$RUNNER_TEMP/evidence/configure-summary.txt"
          find "$sysroot" -name 'libglib-2.0*' -o -name 'libpixman-1*' | head -30 | tee -a "$RUNNER_TEMP/evidence/configure-summary.txt"
          set +e
          ./configure \
            --target-list=i386-softmmu \
            --cross-prefix="$prefix-" \
            --cpu=or1k \
            --enable-tcg-interpreter \
            --disable-docs --disable-tools --disable-user \
            --disable-gtk --disable-sdl --disable-vnc --disable-curses \
            --disable-kvm \
            > "$RUNNER_TEMP/evidence/configure.log" 2>&1
          code=$?
          set -e
          echo "configure_exit=$code" | tee -a "$RUNNER_TEMP/evidence/configure-summary.txt"
          tail -120 "$RUNNER_TEMP/evidence/configure.log"
          if [ "$code" -eq 0 ]; then
            ninja -C build qemu-system-i386 >"$RUNNER_TEMP/evidence/build.log" 2>&1
            buildcode=$?
            echo "build_exit=$buildcode" | tee -a "$RUNNER_TEMP/evidence/configure-summary.txt"
            tail -80 "$RUNNER_TEMP/evidence/build.log"
          fi
          # Always preserve exact logs and mark success only if a real ELF is built.
          test -x build/qemu-system-i386
          file build/qemu-system-i386 | tee "$RUNNER_TEMP/evidence/binary-type.txt"
          "$OR1K_CC" -dumpmachine | grep -q or1k
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-or1k-qemu-tci-configure-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
