# Public Google Android 11 system image only, no proprietary game data.
name: Public Android 11 system image small-piece transport
on:
  push:
    paths:
      - .github/workflows/stfu-public-sysimg-small-chunks.yml
permissions:
  contents: read
jobs:
  image-small-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Refuse private repo
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: test "$PRIVATE" = false
      - name: Install official Android 11 image and create bounded chunks
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" 'system-images;android-30;google_apis;x86_64' || test "${PIPESTATUS[1]}" -eq 0
          mkdir -p "$RUNNER_TEMP/sdk-parts"
          tar -C "$SDK" -czf "$RUNNER_TEMP/sdk-parts/android11-x86_64.tar.gz" system-images/android-30/google_apis/x86_64
          (cd "$RUNNER_TEMP/sdk-parts" && sha256sum android11-x86_64.tar.gz > manifest.sha256)
          split -d -a 2 -b 48M "$RUNNER_TEMP/sdk-parts/android11-x86_64.tar.gz" "$RUNNER_TEMP/sdk-parts/sysimg-"
          rm "$RUNNER_TEMP/sdk-parts/android11-x86_64.tar.gz"
          test "$(find "$RUNNER_TEMP/sdk-parts" -name 'sysimg-*' | wc -l)" -le 34
          ls -lh "$RUNNER_TEMP/sdk-parts"
      - uses: actions/upload-artifact@v4
        with:
          name: official-sdk-api30-chunk-manifest
          path: ${{ runner.temp }}/sdk-parts/manifest.sha256
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: official-sdk-api30-48mb-00
          path: ${{ runner.temp }}/sdk-parts/sysimg-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: official-sdk-api30-48mb-01
          path: ${{ runner.temp }}/sdk-parts/sysimg-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: official-sdk-api30-48mb-02
          path: ${{ runner.temp }}/sdk-parts/sysimg-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: official-sdk-api30-48mb-03
          path: ${{ runner.temp }}/sdk-parts/sysimg-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
